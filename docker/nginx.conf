# 搭配台 Web 前端容器（nginx）：托管 Flutter 构建产物，
# 并把 /api、/files、SSE 反向代理到服务端容器（compose 服务名 server，容器内端口 4584）。
# 对外端口由 docker-compose.yaml 的端口映射决定（默认 4584:80）。

server {
    listen 80;
    server_name _;

    charset utf-8;

    # 上传图片经此转发：服务端上限 10MB（settings.maxUploadMB），
    # 这里略放宽，让超限请求仍由服务端返回友好报错
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter Web（hash 路由）：静态文件直出，其余落回 index.html。
    # 构件名（main.dart.js 等）重建后不变，强制每次向服务端校验（ETag 304 开销很小），
    # 避免同事浏览器看到旧界面。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 出图/优化进度走 SSE：必须关闭缓冲，保持长连接（出图长任务由心跳保活）
    location /api/ {
        proxy_pass http://server:4584;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 素材 / 样板 / 效果图等数据图片
    location /files/ {
        proxy_pass http://server:4584;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 容器健康检查用（不依赖服务端容器，接口异常时由 /api/ 报错体现）
    location = /healthz {
        return 200 "ok";
    }
}
