<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="搭配台：素材库 / 样板库 / 预设 / 一键出图">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="搭配台">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>搭配台</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // 内网部署：不加 CDN —— canvaskit 用构建产物内的本地副本
    // （配合 flutter build web --no-web-resources-cdn），
    // fontFallback 指向本地目录，避免断外网时向 gstatic 请求回退字体；
    // serviceWorkerVersion 置 null 关闭 Service Worker，防止旧产物被缓存。
    _flutter.loader.load({
      config: {
        canvasKitBaseUrl: "canvaskit/",
        fontFallbackBaseUrl: "assets/fallback_fonts/",
      },
      serviceWorker: { serviceWorkerVersion: null },
    });
  </script>
</body>
</html>
